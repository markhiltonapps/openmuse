<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FBFBFB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Neddy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // The bare address is the home page for visitors (owner, 2026-11-25). The app stays at "/"
      // for anyone signed in on this device, the installed app, a tab already using it (reloads),
      // and every link that carries something (?task=, #login=, ?request). "/app" always opens it.
      (() => {
        try {
          const l = window.location;
          const installed =
            window.navigator.standalone === true ||
            window.matchMedia?.("(display-mode: standalone)").matches;
          const used = window.sessionStorage.getItem("neddy.app") === "1";
          const signedIn = !!window.localStorage.getItem("openmuse.session");
          if (l.pathname === "/" && !l.search && !l.hash && !installed && !used && !signedIn) {
            l.replace("/neddy.html");
            return;
          }
          window.sessionStorage.setItem("neddy.app", "1");
        } catch {}
      })();
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
