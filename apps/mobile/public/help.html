<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neato_Muse Help</title>
    <!-- The guide lives in the app now (Help & how-to); old links and invite emails land here. -->
    <meta http-equiv="refresh" content="0; url=/?help=start" />
    <script>
      // The old page's sections, by their #anchors, open the same part of the guide.
      var parts = {
        start: "start",
        tour: "find-your-way",
        ask: "things-to-ask",
        jobs: "website-jobs",
        safe: "control",
        tips: "start",
        fix: "fix",
      };
      var part = parts[location.hash.slice(1)] || "start";
      location.replace(`/?help=${encodeURIComponent(part)}`);
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px 20px;
        color: #11191c;
        background: #fcfcfc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f3f3f5;
          background: #000000;
        }
        a {
          color: #8cc8ff;
        }
      }
    </style>
  </head>
  <body>
    <p>The help guide is in the app now. <a href="/?help=start">Open Help &amp; how-to</a>.</p>
  </body>
</html>
